{% extends "base.html" %}

{% block title %}Додати книгу{% endblock %}

{% block content %}
    <h2>Додавання нової книги</h2>
    <form method="post">
        {% csrf_token %}
        <p><input type="text" name="title" placeholder="Назва" required></p>
        <p><input type="text" name="author" placeholder="Автор" required></p>
        <p><input type="number" name="year" placeholder="Рік" required></p>
        <p><input type="text" name="genre" placeholder="Жанр" required></p>
        <p><input type="number" step="0.01" name="price" placeholder="Ціна" required></p>
        <button type="submit">Зберегти</button>
    </form>
{% endblock %}
